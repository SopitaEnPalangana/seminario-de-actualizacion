<script type="text/javascript">
    class Ejercicio4 extends HTMLElement
    {
        constructor()
        {
            super()

            this.style.display = 'flex';
            this.style.flexDirection = 'column';
            this.style.height = '80vh';
            this.style.border = '3px solid #ccc';
            this.style.borderRadius = '5px';
            this.style.overflow = 'hidden';


            this.header = document.createElement('div');
            this.header.className = 'header';
            //this.header.style.flex = '0 0 auto';
            this.titleH = document.createElement('h2');
            this.titleH.textContent = "Chat";
            this.header.appendChild(this.titleH);
            //------------------------------------------------------
            this.writing_frame = document.createElement('div');
            this.writing_frame.classList.add("div");
            this.leftsideMessage = document.createElement('input');
            this.leftsideMessage.style = 'float: left;';
            this.leftbtn = document.createElement('button');
            this.leftbtn.innerText = 'Send message (L)';
            this.leftbtn.style = 'float: left;';
            
            this.rightsideMessage = document.createElement('input');
            this.rightsideMessage.style = 'float: right;';
            this.rightbtn = document.createElement('button');
            this.rightbtn.innerText = 'Send message (R)';
            this.rightbtn.style = 'float:right;';
            
            this.writing_frame.appendChild(this.leftsideMessage);
            this.writing_frame.appendChild(this.rightbtn);
            this.writing_frame.appendChild(this.rightsideMessage);
            this.writing_frame.appendChild(this.leftbtn);
            //-------------------------------------------------------
            
            this.messagelist = [];

            this.messages_frame = document.createElement('div');
            this.messages_frame.style.flex = '1 1 auto';
            this.messages_frame.style.overflowY = 'auto';
            this.messages_frame.style.padding = '0 10px';

            this.appendChild(this.header);
            this.appendChild(this.messages_frame);
            this.appendChild(this.writing_frame);
           
        }

        reloadView()
        {
            this.messagelist.forEach(function(message){
                this.messages_frame.appendChild(message);
            }.bind(this));

            this.messages_frame.scrollTop = this.messages_frame.scrollHeight;

            this.leftsideMessage.value = '';
            this.rightsideMessage.value = '';
        }
        
        getCurrentTime()     //las funciones relacionadas con hora y tiempo siempre se las pido a Claude
        {                    //nunca termino de entender o aprender como manejan la hora
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            return `${hh}:${mm}`;
        }
        
        onleftbtnclick()
        {
            const newMessage = this.leftsideMessage.value;
            
            let container = document.createElement('div');
            container.className = 'container';
            let profilepic = document.createElement('img');
            profilepic.alt = "Avatar";
            profilepic.style = "width:100%";
            profilepic.src = "https://www.w3schools.com/w3images/bandmember.jpg";
            let message = document.createElement('p');
            message.textContent = newMessage;
            let time = document.createElement('span');
            time.className = "time-right";
            time.textContent = this.getCurrentTime();
            container.appendChild(profilepic);
            
            container.appendChild(message);
            container.appendChild(time);
            
            this.messagelist.push(container);   
            
            this.reloadView();
        }

        onrightbtnclick()
        {
            const newMessage = this.rightsideMessage.value;
            
            let container = document.createElement('div');
            container.className = 'container darker';
            let profilepic = document.createElement('img');
            profilepic.alt = "Avatar";
            profilepic.style = "width:100%";
            profilepic.src = "https://www.w3schools.com/w3images/avatar_g2.jpg";
            let message = document.createElement('p');
            message.textContent = newMessage;
            let time = document.createElement('span');
            time.className = "time-right";
            time.textContent = this.getCurrentTime();
            
            container.appendChild(profilepic);
            container.appendChild(message);
            container.appendChild(time);
   
            this.messagelist.push(container);   
            
            this.reloadView();
        }

        connectedCallback()
        {
            this.leftbtn.onclick = this.onleftbtnclick.bind(this);
            this.rightbtn.onclick = this.onrightbtnclick.bind(this);

        }

        disconnectedCallback()
        {
            this.leftbtn.onclick = null;
            this.rightbtn.onclick = null;
        }
    }

    customElements.define('x-ejercicio4', Ejercicio4);
    function main()
    {
        let miEjercicio = new Ejercicio4();
        document.body.appendChild(miEjercicio);
    }
    window.onload = main;
</script>
</html>
