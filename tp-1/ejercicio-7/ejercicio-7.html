<!--
7. Extienda el WebComponent desarrollado en el punto anterior, 
y agregue un botón que permita alternar la visualización de temperaturas de (ºC) a (ºF) y viceversa.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos-Meteorologicos</title>
    <style>
            table{    
                width: auto;
                margin: 0 auto;
                border-collapse: collapse;
                table-layout: fixed;
                border: 2px solid black;
                background-color: lightgray;
            }

            .row{
                border: 2px solid black;
                padding: 5px;
                text-align: center;
                font-weight: bold;
            }

            .textrow{
                border: 2px solid black;
                padding: 5px;
                font-weight: bold;
            }

            button{
                margin: 30px 50px;
                border: 2px solid black;
                padding: 10px;
                font-weight: bolder;
            }

            .averages{
                width: 600px;
                margin: 0 auto;
                border: 2px solid black;
                padding: 5px;
                font-weight: bold;
            }

            .averages label{
                margin: 5px;
            }


    </style>
</head>
<body></body>
<script type="text/javascript">

    class RegistroTemperaturas extends HTMLElement
    {
        constructor()
        {
            super()
            
            this.months = ['Ene.', 'Feb.', 'Mar.', 'Abr.', 'May.', 'Jun.', 'Jul.', 'Ago.', 'Sep.', 'Oct.', 'Nov.', 'Dic.', 'Anual'];
            this.meassurements = [
                'Temp. max. abs. (ºC)', 
                'Temp. max. media (ºC)', 
                'Temp. media (ºC)', 
                'Temp. min. media (ºC)', 
                'Temp. min. abs. (ºC)', 
                'Precipitacion total (mm)', 
                'Dias de Precipitaciones (>= 0.1mm)', 
                'Horas de sol', 
                'Humedad relativa (%)'];
            
            let tempmaxabs = [42.4,38.1,36.3,32.5,27.4,22.2,27.7,24.7,28.8,34.4,35.7,39.4, 39.4];
            let tempmaxmedia = [26.3,25.8,23.7,20.5,16.8,13.8,13.1,14.4,16.0,18.5,21.7,24.4, 19.6];
            let tempmedia = [20.3,19.9,18.0,14.6,11.3,8.5,8.1,8.9,10.5,13.1,15.9,18.5, 14.0];
            let tempminmedia = [14.3,14.1,12.5,9.1,6.4,4.1,3.8,4.0,5.3,7.6,10.1,12.7, 8.7];
            let tempminabs = [4.7,1.2,1.9,-1.0,-3.0,-5.5,-9.3,-6.4,-5.5,-3.0,-2.0,-0.2, -9.3];
            let precipitacion = [100.1,72.8,107.0,73.3,73.5,54.9,58.9,64.0,56.4,83.4,75.3,104.0, 923.6];
            let diasdeprecip = [9,8,9,9,9,9,9,8,7,10,10,10, 107];
            let horasdesol = [288.3,234.5,232.5,195.0,167.4,120.0,127.1,164.3,174.0,210.8,222.0,269.7, 2405.6];
            let humedadrelativa = [76,77,79,81,83,84,81,81,80,80,77,76, 80];

            this.meassuredata = [tempmaxabs, tempmaxmedia, tempmedia, tempminmedia, tempminabs, precipitacion,diasdeprecip,horasdesol,humedadrelativa];

            this.monthlyvalues = new Map(); //para guardar los valores
            this.valueLabels = new Map(); //para guardar la referencia al label correcto

            this.meassurements.forEach((meassure, j) =>  //tuve que usar una flecha porque no me dejaba acceder a las variables
            {
                let data = this.meassuredata[j];

                this.months.forEach((month, i) =>
                {
                    this.monthlyvalues.set(`${meassure}-${month}`, data[i]);
                });
            });

            //ayuda de claude para manejar los colores:----
            function normalizar(valor, min, max) 
            {
                if (max === min) return 0.5; // evita dividir por 0 si todos los valores son iguales
                return (valor - min) / (max - min);
            }

            function colorPorValor(porcentaje) 
            {
                // luminosidad va de 90% (rojo clarito) a 40% (rojo fuerte)
                const luminosidad = 90 - (porcentaje * 50);
                return `hsl(0, 80%, ${luminosidad}%)`;
            }

            this.unidad =
            {
                medida: 'cel', 
            };
            //---------------------------------------------
 
            let tablita = document.createElement('table');
            const titlerow = tablita.insertRow();
            titlerow.classList.add('textrow');
            const headerCol = titlerow.insertCell();
            headerCol.colSpan = 14;
            headerCol.classList.add('textrow');
            this.header = document.createElement('label');
            this.header.innerText = 'Parametros climaticos promedio de Mar del Plata, BA (1961-1990).';
            headerCol.appendChild(this.header);

            const meslabel = document.createElement('label');
            meslabel.innerText = 'Mes';
            const monthrow = tablita.insertRow();
            monthrow.classList.add('row');
            const firstcolumn = monthrow.insertCell();
            firstcolumn.classList.add('row');
            firstcolumn.appendChild(meslabel);
            
            this.months.forEach((month) =>
            {
                const monthlabel = document.createElement('label');
                monthlabel.innerText = month;
                const column = monthrow.insertCell();
                column.classList.add('row');
                column.appendChild(monthlabel);
            });


            this.meassurements.forEach((meassure, j) =>
            {
                const meassurelabel = document.createElement('label');
                meassurelabel.innerText = meassure;
                const addRow = tablita.insertRow();
                addRow.classList.add('textrow');
                const meassureCol = addRow.insertCell().appendChild(meassurelabel);

                //----colors
                // sacamos los 12 valores de esta fila para calcular el rango
                const datosDeFila = this.meassuredata[j];
                const min = Math.min(...datosDeFila);
                const max = Math.max(...datosDeFila);
                //------------

                this.months.forEach((month) =>
                {
                    const valueCol = addRow.insertCell();
                    valueCol.classList.add('row');
                    const valuelabel = document.createElement('label');
                    const valor = this.monthlyvalues.get(`${meassure}-${month}`);
                    valuelabel.innerText = valor;

                    this.valueLabels.set(`${meassure}-${month}`, valuelabel);

                    // calculamos y aplicamos el color
                    const porcentaje = normalizar(valor, min, max);
                    valueCol.style.backgroundColor = colorPorValor(porcentaje);

                    valueCol.appendChild(valuelabel);
                });
            });

            
            let fuenterow = tablita.insertRow();
            fuenterow.classList.add('textrow');
            let fuentelabel = document.createElement('label');
            fuentelabel.innerText = 'Fuente nº1: NOAA, Servicio Meteorologico Nacional (precipitation days)';
            let fuenteCol = fuenterow.insertCell();
            fuenteCol.colSpan = 13;
            fuenteCol.appendChild(fuentelabel);

            let lastrow = tablita.insertRow();
            lastrow.classList.add('textrow');
            let lastlabel = document.createElement('label');
            lastlabel.innerText = 'Fuente nº2: UNLP(sun only)';
            let lastCol = lastrow.insertCell();
            lastCol.colSpan = 13;
            lastCol.appendChild(lastlabel);

            this.averagebtn = document.createElement('button');
            this.averagebtn.innerText = 'Ver Promedios';
            this.celsiusbtn = document.createElement('button');
            this.celsiusbtn.innerText = 'Ver en Cº';
            this.farenheitbtn = document.createElement('button');
            this.farenheitbtn.innerText = 'Ver en Fº';
            if(this.unidad.medida == 'cel')
            {
                this.celsiusbtn.style.display = 'disabled';
            }
            else
            {
                this.farenheitbtn.style.display = 'disabled';
            }
            
            this.average_frame = document.createElement('div');
            
            this.appendChild(tablita);
            this.appendChild(this.averagebtn);
            this.appendChild(this.celsiusbtn);
            this.appendChild(this.farenheitbtn);
            this.appendChild(this.average_frame);
        }

        onaveragebtnclick()
        {                        
            while(this.average_frame.firstChild) 
            {
                this.average_frame.removeChild(this.average_frame.lastChild);
            };


            const promedio = this.meassurements.map((meassure) =>
            {
                let contador = 0;
                let suma = 0;

                this.months.forEach((month) =>
                {
                    if(contador < 12) //para que no incluya el valor de Anual
                    {
                        let value = this.monthlyvalues.get(`${meassure}-${month}`);
                        suma += value;
                        contador++;
                    }
                });

                return (suma/contador).toFixed(2);
            });
            
            promedio.forEach((value, i) =>
            {

                let newAverage = document.createElement('div');
                newAverage.classList.add('averages');
                let meassure = this.meassurements[i];
                let averageLabel = document.createElement('label');
                averageLabel.innerText = meassure + ': ';
                let averageValue = document.createElement('label');
                averageValue.innerText = value;

                newAverage.appendChild(averageLabel);
                newAverage.appendChild(averageValue);

                this.average_frame.appendChild(newAverage);
            });

        }

        onvercelsiusclick()
        {
            while(this.average_frame.firstChild) 
            {
                this.average_frame.removeChild(this.average_frame.lastChild);
            };

            if(this.unidad.medida == 'far')
            {
                for (let i = 0; i < 5; i++)
                {
                    this.months.forEach((month) =>
                    {
                        let far = this.monthlyvalues.get(`${this.meassurements[i]}-${month}`);
                        let cels = (far - 32) * 5/9;
                        this.monthlyvalues.set(`${this.meassurements[i]}-${month}`, cels);
    
                        let label = this.valueLabels.get(`${this.meassurements[i]}-${month}`);
                        label.innerText = cels.toFixed(1);
                    });
                }

                this.unidad.medida = 'cel';
            }
            else
            {
                console.log('ERROR: Ya esta en Cº');
            }

        }

        onverfarenheitclick()
        {
            while(this.average_frame.firstChild) 
            {
                this.average_frame.removeChild(this.average_frame.lastChild);
            };

            if(this.unidad.medida == 'cel')
            {
                for (let i = 0; i < 5; i++)
                {
                    this.months.forEach((month) =>
                    {
                        let cels = this.monthlyvalues.get(`${this.meassurements[i]}-${month}`);
                        let far = (cels * 9/5) + 32;
                        this.monthlyvalues.set(`${this.meassurements[i]}-${month}`, far);
    
                        let label = this.valueLabels.get(`${this.meassurements[i]}-${month}`);
                        label.innerText = far.toFixed(2);
                    });
                }
                this.unidad.medida = 'far';

            }
            else
            {
                console.log('ERROR: Ya esta en Fº');
            }
        }

        connectedCallback()
        {
            this.averagebtn.onclick = this.onaveragebtnclick.bind(this);
            this.celsiusbtn.onclick = this.onvercelsiusclick.bind(this);
            this.farenheitbtn.onclick = this.onverfarenheitclick.bind(this);
        }

        disconnectedCallback()
        {
            this.averagebtn.onclick = null;
            this.celsiusbtn.onclick = null;
            this.farenheitbtn.onclick = null;
        }
    }

    customElements.define('x-registro-temperaturas', RegistroTemperaturas);
    function main()
    {
        let miRegistro = new RegistroTemperaturas();
        document.body.appendChild(miRegistro);
    }
    window.onload = main;
</script>
</html>
